set timeout=2
set default=0

# selinux=0: o rootfs live nao e rotulado; o disco instalado e rotulado pelo whitehat-install.
menuentry "WhiteHat Linux Server 1.0 (Live, Base Fedora Server 45)" {
    linux /boot/vmlinuz root=live:CDLABEL=WHITEHAT_SRV rd.live.image rd.live.overlay.overlayfs=1 selinux=0 console=tty0 nomodeset
    initrd /boot/initrd.img
}
